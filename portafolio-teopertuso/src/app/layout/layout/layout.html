<div class="flex flex-col h-screen bg-black text-white">
  <!-- NAVBAR MEJORADA -->
  <header
    class="sticky top-0 z-[100]"
    style="
      background: linear-gradient(to bottom, rgba(10, 10, 10, 0.95), rgba(5, 5, 5, 0.85));
      backdrop-filter: blur(20px);
    "
  >
    <!-- Línea de acento superior -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

    <nav class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <!-- Logo / Avatar -->
      <a routerLink="/" class="group relative flex-shrink-0">
        <div
          class="absolute -inset-1 rounded-full bg-gradient-to-tr from-white/10 to-white/0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        ></div>
        <img
          src="assets/images/perfil.png"
          alt="logo"
          class="relative w-12 h-12 rounded-full ring-1 ring-white/10 group-hover:ring-white/30 transition-all duration-300 object-cover"
        />
      </a>

      <!-- Nav desktop -->
      <div class="hidden md:flex items-center">
        <div
          class="flex items-center gap-1 rounded-full px-2 py-2"
          style="border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03)"
        >
          <a
            routerLink="/"
            routerLinkActive="!text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link relative px-4 py-1.5 rounded-full text-sm font-light tracking-wide text-white/50 transition-all duration-200 hover:text-white/90"
          >
            <span class="relative z-10">Home</span>
            <!-- Pill activo -->
            <span
              class="active-pill absolute inset-0 rounded-full opacity-0"
              style="
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.1);
              "
            ></span>
          </a>

          <a
            routerLink="/about"
            routerLinkActive="!text-white"
            class="nav-link relative px-4 py-1.5 rounded-full text-sm font-light tracking-wide text-white/50 transition-all duration-200 hover:text-white/90"
          >
            <span class="relative z-10">About</span>
            <span
              class="active-pill absolute inset-0 rounded-full opacity-0"
              style="
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.1);
              "
            ></span>
          </a>

          <a
            routerLink="/projects"
            routerLinkActive="!text-white"
            class="nav-link relative px-4 py-1.5 rounded-full text-sm font-light tracking-wide text-white/50 transition-all duration-200 hover:text-white/90"
          >
            <span class="relative z-10">Projects</span>
            <span
              class="active-pill absolute inset-0 rounded-full opacity-0"
              style="
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.1);
              "
            ></span>
          </a>

          <!-- Contact como CTA separado -->

          <a
            routerLink="/contact"
            class="ml-2 px-5 py-1.5 rounded-full text-sm font-normal text-black bg-white hover:bg-white/90 transition-all duration-200 tracking-wide"
          >
            Contact
          </a>
        </div>
      </div>

      <!-- Hamburger mobile -->
      <button
        class="relative z-[110] md:hidden ml-auto h-9 w-9 flex items-center justify-center rounded-full text-white/70 hover:text-white transition-colors"
        style="border: 1px solid rgba(255, 255, 255, 0.1)"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        <svg
          class="w-4 h-4 transition-all duration-300"
          [class.opacity-0]="isMenuOpen"
          [class.scale-75]="isMenuOpen"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
        <svg
          class="w-4 h-4 absolute transition-all duration-300"
          [class.opacity-0]="!isMenuOpen"
          [class.opacity-100]="isMenuOpen"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </nav>

    <!-- Línea inferior -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/8 to-transparent"></div>
  </header>

  <!-- Menú mobile -->
  <div
    *ngIf="isMenuOpen"
    class="fixed inset-0 z-[90] md:hidden"
    style="background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px)"
    (click)="closeMenu()"
  >
    <div
      class="absolute top-[64px] left-0 w-full"
      style="background: rgba(8, 8, 8, 0.98); border-bottom: 1px solid rgba(255, 255, 255, 0.08)"
      (click)="$event.stopPropagation()"
    >
      <div class="flex flex-col px-6 py-6">
        <a
          routerLink="/"
          (click)="closeMenu()"
          class="py-4 text-base font-light tracking-widest text-white/60 hover:text-white uppercase transition-colors border-b border-white/5"
        >
          Home
        </a>
        <a
          routerLink="/about"
          (click)="closeMenu()"
          class="py-4 text-base font-light tracking-widest text-white/60 hover:text-white uppercase transition-colors border-b border-white/5"
        >
          About
        </a>
        <a
          routerLink="/projects"
          (click)="closeMenu()"
          class="py-4 text-base font-light tracking-widest text-white/60 hover:text-white uppercase transition-colors border-b border-white/5"
        >
          Projects
        </a>
        <a
          routerLink="/contact"
          (click)="closeMenu()"
          class="py-4 text-base font-light tracking-widest text-white/60 hover:text-white uppercase transition-colors"
        >
          Contact
        </a>
      </div>
    </div>
  </div>

  <main class="flex-1 w-full overflow-y-auto md:overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>
