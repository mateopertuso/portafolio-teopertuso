<section class="relative w-full bg-black text-white">
  <div class="grain pointer-events-none absolute inset-0 z-[80]"></div>

  <div
    class="pointer-events-none absolute inset-0 z-[1]"
    style="
      background:
        radial-gradient(ellipse 80% 60% at 70% 40%, rgba(30, 60, 120, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(15, 30, 80, 0.2) 0%, transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 0%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 30, 0.4) 100%);
    "
  ></div>

  <aside class="fixed left-6 top-1/2 z-50 hidden -translate-y-1/2 md:flex">
    <div
      class="flex flex-col gap-3 rounded-2xl border border-white/8 bg-white/3 p-3 backdrop-blur-md shadow-[0_8px_32px_rgba(0,0,0,0.5)] animate-fadeInUp"
    >
      <ng-container *ngTemplateOutlet="socialIcon; context: { showTooltip: true }"></ng-container>
    </div>
  </aside>

  <main
    class="relative z-10 mx-auto max-w-4xl px-6 py-20 flex flex-col gap-16 md:flex-row md:items-center md:justify-between md:min-h-[calc(100svh-75px)] md:py-0"
  >
    <div
      class="flex flex-col items-center text-center md:items-start md:text-left animate-fadeInUp"
    >
      <div
        class="mb-6 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-1.5 backdrop-blur-sm"
      >
        <span
          class="h-1.5 w-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.8)]"
        ></span>
        <span class="text-xs font-light tracking-widest text-white/60 uppercase"
          >Available for work</span
        >
      </div>
      <h1 class="text-5xl font-bold tracking-tight text-white sm:text-7xl leading-none">
        Mateo
        <span
          class="block sm:inline text-transparent bg-clip-text"
          style="
            background-image: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
          "
        >
          Pertuso
        </span>
      </h1>

      <p class="mt-6 max-w-lg text-base text-white/40 leading-relaxed text-balance font-light">
        I am a <span class="text-white/90 font-normal">Software Developer</span> passionate about
        building innovative, user-centric web applications using modern technologies.
      </p>

      <div class="mt-10 flex gap-3">
        <a
          routerLink="/projects"
          class="rounded-full bg-white px-7 py-2.5 text-sm font-normal text-black transition-all hover:bg-white/90 tracking-wide"
        >
          My Work
        </a>
        <a
          routerLink="/contact"
          class="rounded-full border border-white/10 bg-white/5 px-7 py-2.5 text-sm font-light text-white/70 transition-all hover:text-white hover:bg-white/10 tracking-wide backdrop-blur-sm"
        >
          Contact Me
        </a>
      </div>
    </div>

    <div class="relative mt-10 md:mt-0 animate-fadeInUp">
      <div
        class="absolute -inset-8 rounded-full opacity-30"
        style="
          background: radial-gradient(circle, rgba(96, 165, 250, 0.15) 0%, transparent 70%);
          filter: blur(20px);
        "
      ></div>

      <div class="relative grid grid-cols-2 gap-3 sm:grid-cols-3 md:gap-4">
        <div
          *ngFor="let tech of technologies; let i = index"
          class="group flex flex-col items-center justify-center gap-2 rounded-2xl border border-white/8 bg-white/3 p-4 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-white/20 hover:bg-white/8 animate-fadeInUp"
        >
          <ng-container [ngSwitch]="tech.icon">
            <img
              *ngSwitchCase="'angular'"
              src="assets/images/angular_gradient.png"
              alt="Angular"
              class="h-10 w-10"
            />
            <img
              *ngSwitchCase="'csharp'"
              src="assets/images/csharp.png"
              alt="csharp"
              class="h-14 w-14"
            />
            <svg
              *ngSwitchCase="'typescript'"
              class="h-10 w-10"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="color: #3178c6"
            >
              <path
                d="M1.125 0C.502 0 0 .502 0 1.125v21.75C0 23.498.502 24 1.125 24h21.75c.623 0 1.125-.502 1.125-1.125V1.125C24 .502 23.498 0 22.875 0zm17.363 9.75c.612 0 1.154.037 1.627.111a6.38 6.38 0 0 1 1.306.34v2.458a3.95 3.95 0 0 0-.643-.361 5.093 5.093 0 0 0-.717-.26 5.453 5.453 0 0 0-1.426-.2c-.3 0-.573.028-.819.086a2.1 2.1 0 0 0-.623.242c-.17.104-.3.229-.393.374a.888.888 0 0 0-.14.49c0 .196.053.373.156.529.104.156.252.304.443.444s.423.276.696.41c.273.135.582.274.926.416.47.197.892.407 1.266.628.374.222.695.473.963.753.268.279.472.598.614.957.142.359.214.776.214 1.253 0 .657-.125 1.21-.373 1.656a3.033 3.033 0 0 1-1.012 1.085 4.38 4.38 0 0 1-1.487.596c-.566.12-1.163.18-1.79.18a9.916 9.916 0 0 1-1.84-.164 5.544 5.544 0 0 1-1.512-.493v-2.63a5.033 5.033 0 0 0 3.237 1.2c.333 0 .624-.03.872-.09.249-.06.456-.144.623-.25.166-.108.29-.234.373-.38a1.023 1.023 0 0 0-.074-1.089 2.12 2.12 0 0 0-.537-.5 5.597 5.597 0 0 0-.807-.444 27.72 27.72 0 0 0-1.007-.436c-.918-.383-1.602-.852-2.053-1.405-.45-.553-.676-1.222-.676-2.005 0-.614.123-1.141.369-1.582.246-.441.58-.804 1.004-1.089a4.494 4.494 0 0 1 1.47-.629 7.536 7.536 0 0 1 1.77-.201zm-15.113.188h9.563v2.166H9.506v9.646H6.789v-9.646H3.375z"
              />
            </svg>
            <svg
              *ngSwitchCase="'tailwind'"
              class="h-10 w-10"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="color: #06b6d4"
            >
              <path
                d="M12.001,4.8c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 C13.666,10.618,15.027,12,18.001,12c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C16.337,6.182,14.976,4.8,12.001,4.8z M6.001,12c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 c1.177,1.194,2.538,2.576,5.512,2.576c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C10.337,13.382,8.976,12,6.001,12z"
              />
            </svg>
            <svg
              *ngSwitchCase="'git'"
              class="h-10 w-10"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="color: #f05032"
            >
              <path
                d="M23.546 10.93L13.067.452c-.604-.603-1.582-.603-2.188 0L8.708 2.627l2.76 2.76c.645-.215 1.379-.07 1.889.441.516.515.658 1.258.438 1.9l2.658 2.66c.645-.223 1.387-.078 1.9.435.721.72.721 1.884 0 2.604-.719.719-1.881.719-2.6 0-.539-.541-.674-1.337-.404-1.996L12.86 8.955v6.525c.176.086.342.203.488.348.713.721.713 1.883 0 2.6-.719.721-1.889.721-2.609 0-.719-.719-.719-1.879 0-2.598.182-.18.387-.316.605-.406V8.835c-.217-.091-.424-.222-.6-.401-.545-.545-.676-1.342-.396-2.009L7.636 3.7.45 10.881c-.6.605-.6 1.584 0 2.189l10.48 10.477c.604.604 1.582.604 2.186 0l10.43-10.43c.605-.603.605-1.582 0-2.187"
              />
            </svg>
            <div
              *ngSwitchCase="'dotnet'"
              class="flex items-center justify-center h-10 w-10 rounded-lg text-lg font-bold p-6"
              style="background: linear-gradient(135deg, #512bd4 0%, #7b3ff2 100%); color: white"
            >
              .NET
            </div>
            <span *ngSwitchDefault class="text-2xl font-bold text-white/80">{{
              tech.name[0]
            }}</span>
          </ng-container>

          <span
            class="text-xs font-light text-white/40 group-hover:text-white/80 transition-colors tracking-wide"
          >
            {{ tech.name }}
          </span>
        </div>
      </div>
    </div>

    <!-- Social mobile -->
    <div class="md:hidden mt-8 flex justify-center">
      <div class="animate-float">
        <div
          class="flex gap-3 rounded-2xl border border-white/8 bg-white/3 px-4 py-3 backdrop-blur-md shadow-[0_10px_30px_rgba(0,0,0,0.6)] -translate-y-6"
        >
          <ng-container
            *ngTemplateOutlet="socialIcon; context: { showTooltip: false }"
          ></ng-container>
        </div>
      </div>
    </div>
  </main>

  <ng-template #socialIcon let-showTooltip="showTooltip">
    <a
      *ngFor="let link of socialLinks"
      [href]="link.url"
      target="_blank"
      rel="noopener noreferrer"
      class="group relative flex h-10 w-10 items-center justify-center rounded-xl border border-white/8 bg-white/3 text-white/40 backdrop-blur-sm transition-all duration-200 hover:scale-110 hover:border-white/20 hover:bg-white/8 hover:text-white"
    >
      <ng-container [ngSwitch]="link.icon">
        <svg
          *ngSwitchCase="'linkedin'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="transition-transform group-hover:scale-110"
        >
          <path
            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
          />
        </svg>
        <svg
          *ngSwitchCase="'github'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="transition-transform group-hover:scale-110"
        >
          <path
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
          />
        </svg>
        <svg
          *ngSwitchCase="'tiktok'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="transition-transform group-hover:scale-110"
        >
          <path
            d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"
          />
        </svg>
        <svg
          *ngSwitchCase="'youtube'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="transition-transform group-hover:scale-110"
        >
          <path
            d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"
          />
        </svg>
        <svg
          *ngSwitchCase="'x'"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="transition-transform group-hover:scale-110"
        >
          <path
            d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"
          />
        </svg>
        <span *ngSwitchDefault>?</span>
      </ng-container>

      <span
        *ngIf="showTooltip"
        class="absolute left-14 whitespace-nowrap rounded-lg border border-white/10 bg-black/90 px-3 py-1.5 text-xs font-light text-white/70 opacity-0 shadow-lg transition-opacity group-hover:opacity-100 tracking-wide"
      >
        {{ link.name }}
      </span>
    </a>
  </ng-template>
</section>
